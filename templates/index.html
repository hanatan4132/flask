<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全網資費監控</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --border: #252830;
    --header-bg: #1a1d26;
    --col-sticky: #161920;
    --text: #e2e6ef;
    --muted: #6b7280;
    --accent: #3b82f6;
    --positive: #22c55e;
    --negative: #ef4444;
    --header-h1: 36px;
    --header-h2: 28px;
    --row-h: 34px;
    --sym-w: 50px;   /* 從 62px 縮減到 50px */
    --cell-w: 82px;  /* 稍微縮減費率欄位，爭取更多空間 */
  }

  /* 調整幣種欄位的文字對齊與間距 */
  .col-sym {
    position: sticky;
    left: 0;
    z-index: 55;
    background: var(--col-sticky);
    min-width: var(--sym-w);
    max-width: var(--sym-w);
    text-align: left;      /* 改為左對齊 */
    padding-left: 6px !important; /* 靠左一點點 */
    border-right: 1px solid var(--border);
    font-weight: 700;
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 8px;
  }
  #topbar h1 { font-size: 14px; font-weight: 700; color: var(--text); }
  #status-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
  #status-dot.live { background: var(--positive); box-shadow: 0 0 6px var(--positive); }
  #status-dot.error { background: var(--negative); }

  #filterbar {
    display: flex; gap: 6px; align-items: center;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #search-input {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text);
    padding: 4px 8px; font-size: 12px; width: 110px;
  }
  .filter-btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; color: var(--muted);
    padding: 3px 9px; font-size: 11px; cursor: pointer;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); }

  #table-wrap { flex: 1; overflow: auto; position: relative; }

  table { border-collapse: separate; border-spacing: 0; min-width: max-content; }
  th, td { border-bottom: 1px solid var(--border); white-space: nowrap; }

  thead tr:first-child th {
    position: sticky; top: 0; background: var(--header-bg); z-index: 60;
    height: var(--header-h1); font-size: 11px;
  }
  thead tr:last-child th {
    position: sticky; top: var(--header-h1); background: var(--header-bg); z-index: 60;
    height: var(--header-h2); font-size: 10px; border-bottom: 2px solid var(--border);
  }

  .col-sym {
    position: sticky; left: 0; z-index: 55;
    background: var(--col-sticky); min-width: var(--sym-w); text-align: center;
    border-right: 1px solid var(--border); font-weight: 700;
  }

  /* 優化渲染效能的關鍵 CSS */
  tbody tr {
    content-visibility: auto;
    contain-intrinsic-size: 0 34px;
  }

  td { height: var(--row-h); padding: 0 4px; text-align: right; vertical-align: middle; }
  .time-val { font-size: 10px; color: #4b5563; text-align: center; }
  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .group-border { border-right: 1px solid var(--border); }

  #stats-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .stat-pill { background: #1e2533; border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-size: 10px; color: var(--muted); }
  
  #spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 999; }
  @media (max-width: 600px) {
    :root {
      --sym-w: 46px;   /* 手機上更窄 */
      --cell-w: 78px;  /* 費率欄位也縮窄 */
    }
    
    .col-sym {
      font-size: 10px; /* 幣名稍微縮小一點點 */
      padding-left: 4px !important;
    }

    .rate-val {
      font-size: 11px; /* 費率數字在手機上也縮小一點點 */
    }

    .time-val {
      font-size: 9px;  /* 時間欄位更小 */
    }
  }
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex; align-items:center; gap:10px;">
    <div id="status-dot"></div>
    <h1>全網資費監控</h1>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <span id="count-badge" style="font-size:11px; color:#6b7280;">— 幣種</span>
    <span id="update-time" style="font-size:11px; color:#6b7280;">--:--:--</span>
  </div>
</div>

<div id="filterbar">
  <!-- 注意這裡移除了 oninput -->
  <input id="search-input" type="text" placeholder="搜幣種…">
  <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
  <button class="filter-btn" onclick="setFilter('pos',this)">正資費</button>
  <button class="filter-btn" onclick="setFilter('neg',this)">負資費</button>
  <button class="filter-btn" onclick="setFilter('arb',this)">套利機會</button>
  <button id="refresh-btn" onclick="fetchData()" style="margin-left:auto; background:var(--accent); color:white; border:none; border-radius:5px; padding:4px 12px; cursor:pointer;">刷新</button>
</div>

<div id="stats-row"></div>

<div id="table-wrap">
  <div id="spinner">載入中...</div>
  <table id="rates-table" style="display:none;">
    <thead>
      <tr id="header-row-1"><th class="col-sym" rowspan="2">幣種</th></tr>
      <tr id="header-row-2"></tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const EXCHANGES = {{ exchanges | tojson }};
let globalData   = [];
let currentSort  = { ex: EXCHANGES[0], dir: 1 };
let filterMode   = 'all';

// ─── 初始化表頭 ───
function buildHeaders() {
  const row1 = document.getElementById('header-row-1');
  const row2 = document.getElementById('header-row-2');
  EXCHANGES.forEach((ex, i) => {
    const isLast = i === EXCHANGES.length - 1;
    const th1 = document.createElement('th');
    th1.colSpan = 2; th1.className = 'ex-header' + (isLast ? '' : ' group-border');
    th1.innerHTML = `${ex.toUpperCase()} <span id="arr-${ex}">▼</span>`;
    th1.onclick = () => handleSort(ex);
    row1.appendChild(th1);

    const th2a = document.createElement('th'); th2a.className = 'sub-header'; th2a.textContent = '費率';
    const th2b = document.createElement('th'); th2b.className = 'sub-header time-col' + (isLast ? '' : ' group-border'); th2b.textContent = '結算';
    row2.appendChild(th2a); row2.appendChild(th2b);
  });
}

// ─── 排序 ───
function handleSort(ex) {
  if (currentSort.ex === ex) currentSort.dir *= -1;
  else currentSort = { ex, dir: 1 };
  document.querySelectorAll('[id^="arr-"]').forEach(el => el.textContent = '▼');
  document.getElementById(`arr-${ex}`).textContent = currentSort.dir === 1 ? '▲' : '▼';
  applyFilter();
}

// ─── 搜尋防抖 (Debounce) ───
let debounceTimer;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilter, 300);
});

function setFilter(mode, btn) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

// ─── 篩選與排序邏輯 ───
function applyFilter() {
  const searchQuery = document.getElementById('search-input').value.trim().toUpperCase();
  const key = `${currentSort.ex}_rate`;

  let result = globalData.filter(row => {
    // 1. 搜尋篩選
    if (searchQuery && !row.symbol.includes(searchQuery)) return false;
    
    // 2. 模式篩選
    if (filterMode === 'pos') return row[key] > 0;
    if (filterMode === 'neg') return row[key] < 0;
    
    // --- 關鍵修改：以幣安為基準的套利邏輯 ---
    if (filterMode === 'arb') {
      const binanceRate = row['binance_rate'];
      
      // 如果該幣種在幣安沒有資費資料，直接跳過
      if (binanceRate === null) return false;

      // 檢查幣安與「任何一個」其他交易所是否存在 0.05% 以上的利差
      return EXCHANGES.some(ex => {
        if (ex === 'binance') return false; // 跳過自己跟自己比
        const otherRate = row[`${ex}_rate`];
        
        if (otherRate === null) return false;
        
        // 計算絕對值差距是否 >= 0.0005 (0.05%)
        return Math.abs(binanceRate - otherRate) >= 0.01;
      });
    }
    
    return true;
  });

  // 3. 排序邏輯
  result.sort((a, b) => {
    const va = a[key], vb = b[key];
    if (va === null) return 1; 
    if (vb === null) return -1;
    return (va - vb) * currentSort.dir;
  });

  const displayData = result.slice(0, 150); 
  
  // 更新徽章顯示：現在有 800 幣種，但只顯示前 150 名
  document.getElementById('count-badge').textContent = `${result.length} 幣種 (顯示前150)`;

  renderTable(displayData); 
}
// ─── 高效渲染 ───
function renderTable(data) {
  const container = document.getElementById('table-body');
  while (container.firstChild) {
    container.removeChild(container.firstChild);
  }
  const rowsHtml = [];
  
  // 如果資料太多，初次只顯示 150 筆，其餘延遲（或靠 content-visibility）
  data.forEach(row => {
    let cells = `<td class="col-sym">${row.symbol}</td>`;
    EXCHANGES.forEach((ex, i) => {
      const val = row[`${ex}_rate`];
      const rateHtml = val === null ? '<span style="color:#2d3348">—</span>' : 
        `<span class="rate-val ${val>0?'pos':val<0?'neg':''}"> ${(val*100).toFixed(4)}%</span>`;
      const timeStr = row[`${ex}_time`] || '-';
      const border = (i === EXCHANGES.length - 1) ? '' : 'group-border';
      cells += `<td>${rateHtml}</td><td class="time-val ${border}">${timeStr}</td>`;
    });
    rowsHtml.push(`<tr>${cells}</tr>`);
  });

  requestAnimationFrame(() => {
    container.innerHTML = rowsHtml.join('');
    document.getElementById('rates-table').style.display = '';
    document.getElementById('spinner').style.display = 'none';
  });
}

function fetchData() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  fetch('/api/rates')
    .then(r => r.json())
    .then(resp => {
      globalData = null; 
      globalData = resp.data || [];
      document.getElementById('count-badge').textContent = `${globalData.length} 幣種`;
      document.getElementById('update-time').textContent = resp.updated_at;
      document.getElementById('status-dot').className = resp.status === 'updated' ? 'live' : 'error';
      applyFilter();
    })
    .finally(() => btn.disabled = false);
}

buildHeaders();
fetchData();
setInterval(fetchData, 60000);
</script>
</body>
</html>
